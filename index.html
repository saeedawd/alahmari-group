<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Al Ahmari Group - مجموعة الأحمري</title>
  <script>
    (function() {
      // التحقق من وجود اختيار سابق
      const savedLanguage = localStorage.getItem('preferredLanguage');
      
      if (savedLanguage) {
        window.location.href = savedLanguage === 'ar' ? 'ar/' : 'en/';
        return;
      }

      // اكتشاف لغة المتصفح
      const browserLang = navigator.language || navigator.userLanguage || 'en';
      const langCode = browserLang.toLowerCase().split('-')[0];
      
      // قائمة اللغات العربية
      const arabicLanguages = ['ar', 'ar-SA', 'ar-AE', 'ar-BH', 'ar-DZ', 'ar-EG', 'ar-IQ', 'ar-JO', 'ar-KW', 'ar-LB', 'ar-LY', 'ar-MA', 'ar-OM', 'ar-QA', 'ar-SY', 'ar-TN', 'ar-YE'];
      
      // تحديد اللغة
      const targetLang = (langCode === 'ar' || arabicLanguages.includes(browserLang)) ? 'ar' : 'en';
      
      // إعادة التوجيه مباشرة
      window.location.href = targetLang + '/';
    })();
  </script>
</head>
<body>
</body>
</html>
